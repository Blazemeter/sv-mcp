[project]
name = "sv-mcp"
version = "1.0.4"
description = "Service Virtualization MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "mcp[cli]>=1.13.0",
    "pyinstaller>=6.0.0",
    "pydantic>=2.11.7",
    "pydantic-core>=2.33.2",
    "pydantic-settings>=2.10.1",
]

[project.scripts]
sv-mcp = "main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.setuptools]
packages = { find = { where = ["sv_mcp"] } }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
]
