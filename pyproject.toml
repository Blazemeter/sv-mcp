[project]
name = "sv-mcp"
version = "1.0.8"
description = "Service Virtualization MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx[http2]>=0.28.1",
    "mcp[cli]>=1.13.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "pydantic>=2.11.7",
    "pydantic-core>=2.33.2",
    "pydantic-settings>=2.10.1",
]

[project.scripts]
sv-mcp = "sv_mcp.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["sv_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pyinstaller>=6.0.0",
]
